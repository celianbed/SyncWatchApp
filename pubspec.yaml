name: syncwatch_mobile
description: "Application mobile SyncWatch — suivi de séries et de films."
publish_to: 'none'

version: 1.0.0+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # État partagé (session, données d'écran)
  provider: ^6.1.2
  # Appels HTTP vers l'API SyncWatch
  http: ^1.2.2
  # Stockage du jeton JWT dans le trousseau iOS
  flutter_secure_storage: ^9.2.2
  # Polices de la charte : titres Sora, UI Inter
  google_fonts: ^6.2.1
  # Affiches TMDB avec cache disque
  cached_network_image: ^3.4.1
  # Push notifications (iOS via APNs, et Android) — nouvel épisode,
  # abonnement, recommandation
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # Connexion Google
  google_sign_in: ^6.2.2
  # Lecteur YouTube inline (feed de bandes-annonces « Extraits »)
  # Version vendorisée + patchée (player.html : meta referrer strict-origin) pour
  # corriger l'erreur 152 en WebView. Voir vendor/youtube_player_iframe/.
  youtube_player_iframe:
    path: vendor/youtube_player_iframe
  # Ouvrir une bande-annonce sur YouTube quand l'intégration est bloquée
  url_launcher: ^6.3.0
  sign_in_with_apple: ^8.1.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Génération de l'icône d'app et du splash à partir de assets/logo.png
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Icône d'app (iOS + Android) — fond #1E293B identique au logo (pas de transparence iOS)
flutter_launcher_icons:
  image_path: "assets/logo_icon.png"          # version zoomée (iOS + Android legacy)
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#1E293B"
  adaptive_icon_background: "#1E293B"
  adaptive_icon_foreground: "assets/logo.png" # original (l'adaptive Android zoome déjà)
  min_sdk_android: 21

# Écran de démarrage — fond #1E293B (couleur du logo) → le logo se fond dedans
flutter_native_splash:
  color: "#1E293B"
  image: assets/logo.png
  android_12:
    color: "#1E293B"
    image: assets/logo.png

flutter:
  uses-material-design: true

  assets:
    # Polices embarquées : sans elles, google_fonts irait chercher Sora et Inter
    # sur fonts.gstatic.com au premier lancement, et l'app s'afficherait en
    # police système le temps du téléchargement. Les fichiers doivent porter le
    # nom « Famille-Variante.ttf » — c'est ainsi que google_fonts les reconnaît.
    - assets/google_fonts/
    # Logo Google officiel, exigé par leurs conditions sur un bouton de connexion
    - assets/marques/
